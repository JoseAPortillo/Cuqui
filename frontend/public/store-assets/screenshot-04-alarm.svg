<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0a1a"/>
      <stop offset="100%" stop-color="#0f0f23"/>
    </linearGradient>
  </defs>
  <rect width="1080" height="1920" fill="url(#bg)"/>
  <!-- Status bar -->
  <rect x="0" y="0" width="1080" height="80" fill="#0a0a1a"/>
  <text x="50" y="50" font-family="sans-serif" font-size="28" fill="#fff" font-weight="bold">9:41</text>
  <!-- Header -->
  <text x="70" y="160" font-family="sans-serif" font-size="52" font-weight="bold" fill="#4fc3f7">Cuqui</text>
  <!-- Alert banner -->
  <rect x="70" y="200" width="940" height="160" rx="16" fill="#d32f2f" opacity="0.9"/>
  <text x="540" y="270" font-family="sans-serif" font-size="36" fill="#fff" text-anchor="middle" font-weight="bold">⏰ ¡Tiempo cumplido!</text>
  <text x="540" y="318" font-family="sans-serif" font-size="22" fill="#ffcdd2" text-anchor="middle">Pasta — 10 minutos</text>
  <rect x="400" y="340" width="280" height="8" rx="4" fill="#fff" opacity="0.3"/>
  <!-- Timer expired card -->
  <rect x="70" y="420" width="940" height="300" rx="20" fill="#14143a" stroke="#d32f2f" stroke-width="2" stroke-opacity="0.5"/>
  <rect x="70" y="420" width="940" height="8" rx="4" fill="#d32f2f"/>
  <text x="130" y="500" font-family="sans-serif" font-size="72" font-weight="bold" fill="#d32f2f">00:00</text>
  <text x="130" y="545" font-family="sans-serif" font-size="28" fill="#ef5350">Pasta</text>
  <rect x="130" y="580" width="400" height="6" rx="3" fill="#2a2a5e"/>
  <rect x="130" y="580" width="400" height="6" rx="3" fill="#d32f2f"/>
  <!-- Dismiss button -->
  <rect x="720" y="480" width="180" height="60" rx="30" fill="#d32f2f" opacity="0.8"/>
  <text x="810" y="518" font-family="sans-serif" font-size="22" fill="#fff" text-anchor="middle">✕ Cerrar</text>
  <!-- Other timers -->
  <text x="130" y="800" font-family="sans-serif" font-size="22" fill="#666">Otros timers activos</text>
  <rect x="70" y="840" width="940" height="160" rx="20" fill="#14143a" stroke="#2a2a5e" stroke-width="1"/>
  <rect x="70" y="840" width="940" height="8" rx="4" fill="#4fc3f7"/>
  <text x="130" y="900" font-family="sans-serif" font-size="48" font-weight="bold" fill="#4fc3f7">05:00</text>
  <text x="130" y="940" font-family="sans-serif" font-size="24" fill="#aaa">Horno</text>
  <rect x="130" y="970" width="400" height="6" rx="3" fill="#2a2a5e"/>
  <rect x="130" y="970" width="200" height="6" rx="3" fill="#4fc3f7" opacity="0.6"/>
  <!-- Voice button -->
  <circle cx="540" cy="1700" r="65" fill="#4fc3f7"/>
  <circle cx="540" cy="1700" r="50" fill="#0f0f23"/>
  <circle cx="540" cy="1700" r="35" fill="#4fc3f7"/>
  <!-- Navigation bar -->
  <rect x="0" y="1840" width="1080" height="80" fill="#0a0a1a"/>
  <rect x="440" y="1865" width="200" height="8" rx="4" fill="#fff" opacity="0.3"/>
</svg>
