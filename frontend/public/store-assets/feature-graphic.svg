<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="500" viewBox="0 0 1024 500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f0f23"/>
      <stop offset="50%" stop-color="#1a1a3e"/>
      <stop offset="100%" stop-color="#0f0f23"/>
    </linearGradient>
    <linearGradient id="btn" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4fc3f7"/>
      <stop offset="100%" stop-color="#29b6f6"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="500" fill="url(#bg)"/>
  <!-- Decorative elements -->
  <circle cx="950" cy="60" r="180" fill="#4fc3f7" opacity="0.03"/>
  <circle cx="80" cy="450" r="140" fill="#4fc3f7" opacity="0.03"/>
  <!-- Timer progress circles (decorative) -->
  <circle cx="780" cy="250" r="110" fill="none" stroke="#2a2a5e" stroke-width="8"/>
  <circle cx="780" cy="250" r="110" fill="none" stroke="#4fc3f7" stroke-width="8" stroke-dasharray="520 180" stroke-linecap="round" transform="rotate(-90 780 250)"/>
  <text x="780" y="235" font-family="sans-serif" font-size="42" font-weight="bold" fill="#4fc3f7" text-anchor="middle">12:30</text>
  <text x="780" y="265" font-family="sans-serif" font-size="16" fill="#888" text-anchor="middle">timer</text>
  <circle cx="920" cy="140" r="40" fill="none" stroke="#2a2a5e" stroke-width="5"/>
  <circle cx="920" cy="140" r="40" fill="none" stroke="#ff7043" stroke-width="5" stroke-dasharray="150 100" stroke-linecap="round" transform="rotate(-90 920 140)"/>
  <text x="920" y="146" font-family="sans-serif" font-size="14" font-weight="bold" fill="#ff7043" text-anchor="middle">08:00</text>
  <!-- App name and tagline -->
  <text x="100" y="175" font-family="sans-serif" font-size="64" font-weight="bold" fill="#4fc3f7">Cuqui</text>
  <text x="100" y="225" font-family="sans-serif" font-size="22" fill="#aaa">Asistente de cocina inteligente</text>
  <!-- Divider -->
  <rect x="100" y="250" width="200" height="3" rx="1.5" fill="#4fc3f7" opacity="0.3"/>
  <!-- Features -->
  <text x="100" y="300" font-family="sans-serif" font-size="18" fill="#ccc">Control por voz — sin ensuciar tu celular</text>
  <text x="100" y="340" font-family="sans-serif" font-size="18" fill="#ccc">Notificaciones push al finalizar</text>
  <text x="100" y="380" font-family="sans-serif" font-size="18" fill="#ccc">Sin registro, sin publicidad</text>
  <!-- Mic icon -->
  <circle cx="210" cy="440" r="30" fill="url(#btn)"/>
  <circle cx="210" cy="440" r="22" fill="#0f0f23"/>
  <circle cx="210" cy="440" r="15" fill="url(#btn)"/>
  <text x="260" y="447" font-family="sans-serif" font-size="16" fill="#aaa">Presioná y hablá</text>
  <!-- Bottom tag -->
  <rect x="680" y="430" width="230" height="36" rx="18" fill="#4fc3f7" opacity="0.1" stroke="#4fc3f7" stroke-width="1" stroke-opacity="0.3"/>
  <text x="795" y="454" font-family="sans-serif" font-size="13" fill="#4fc3f7" text-anchor="middle">Google Play</text>
</svg>
