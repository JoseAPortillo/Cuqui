<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#0f0f23"/>
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="256" cy="256" r="256" fill="url(#bg)"/>
  <!-- Outer ring -->
  <circle cx="256" cy="256" r="220" fill="none" stroke="#4fc3f7" stroke-width="24"/>
  <!-- Timer dial segments (markers) -->
  <g stroke="#4fc3f7" stroke-width="6" stroke-linecap="round">
    <line x1="256" y1="56" x2="256" y2="86" transform="rotate(0, 256, 256)"/>
    <line x1="256" y1="56" x2="256" y2="76" transform="rotate(30, 256, 256)"/>
    <line x1="256" y1="56" x2="256" y2="76" transform="rotate(60, 256, 256)"/>
    <line x1="256" y1="56" x2="256" y2="86" transform="rotate(90, 256, 256)"/>
    <line x1="256" y1="56" x2="256" y2="76" transform="rotate(120, 256, 256)"/>
    <line x1="256" y1="56" x2="256" y2="76" transform="rotate(150, 256, 256)"/>
    <line x1="256" y1="56" x2="256" y2="86" transform="rotate(180, 256, 256)"/>
    <line x1="256" y1="56" x2="256" y2="76" transform="rotate(210, 256, 256)"/>
    <line x1="256" y1="56" x2="256" y2="76" transform="rotate(240, 256, 256)"/>
    <line x1="256" y1="56" x2="256" y2="86" transform="rotate(270, 256, 256)"/>
    <line x1="256" y1="56" x2="256" y2="76" transform="rotate(300, 256, 256)"/>
    <line x1="256" y1="56" x2="256" y2="76" transform="rotate(330, 256, 256)"/>
  </g>
  <!-- Minute hand (pointing to ~2 min) -->
  <line x1="256" y1="256" x2="256" y2="130" stroke="#4fc3f7" stroke-width="12" stroke-linecap="round" transform="rotate(45, 256, 256)"/>
  <!-- Second hand -->
  <line x1="256" y1="280" x2="256" y2="100" stroke="#4fc3f7" stroke-width="6" stroke-linecap="round" transform="rotate(180, 256, 256)"/>
  <!-- Center dot -->
  <circle cx="256" cy="256" r="12" fill="#4fc3f7"/>
  <!-- Bell/alert indicator at top -->
  <path d="M256 48 C256 48 240 64 240 80 C240 96 248 104 256 104 C264 104 272 96 272 80 C272 64 256 48 256 48Z" fill="#4fc3f7" opacity="0.8"/>
</svg>
